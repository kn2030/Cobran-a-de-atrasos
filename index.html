<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cobrança de atrasos | OTT 3.0</title><style>:root{font-family:Arial,sans-serif;color:#24394a;background:#e9edf2}*{box-sizing:border-box}body{margin:0;padding:14px}h1{font-size:23px;margin:0}small,.muted{color:#71808d}header{border-bottom:3px solid #213d56;padding-bottom:10px;display:flex;justify-content:space-between;align-items:center}.big{font-size:34px;font-weight:800;color:#bb3e2c}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#536473}input,select,button,textarea{font:inherit;border:1px solid #d3dbe1;border-radius:5px;padding:7px;background:white;min-width:0}button{cursor:pointer;color:#fff;background:#203d57;border:0}button:hover{filter:brightness(1.13)}.light{background:#fff;color:#203d57;border:1px solid #aebdc8}.danger{background:#a83f35}.panel{background:white;border:1px solid #dce2e7;border-radius:10px;padding:12px;margin-bottom:12px}h3{font-size:14px;margin:0 0 10px}.top{display:grid;grid-template-columns:2fr 1fr;gap:12px}.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px}.bar{display:grid;grid-template-columns:110px 1fr 65px;gap:7px;align-items:center;font-size:12px}.track{height:9px;border-radius:10px;background:#edf0f2;overflow:hidden}.fill{height:100%;background:#203d57}.reason{display:flex;gap:5px;margin-bottom:5px}.reason input{flex:1}.reason b{color:#bd3e30;padding:7px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:9px}.card{border:1px solid #d5dce2;border-radius:9px;overflow:hidden;background:white}.cardhead{display:flex;justify-content:space-between;background:#203d57;color:white;padding:9px;font-size:13px;font-weight:bold}.route{display:flex;gap:4px;padding:5px;border-bottom:1px solid #e4e8eb;align-items:center;font-size:12px}.route span{flex:1;overflow-wrap:anywhere}.route select{max-width:118px;padding:3px;color:#a13b31;background:#f8e9e7;font-size:11px}.x{background:transparent;color:#667; padding:3px 5px}.add{display:flex;gap:4px;padding:7px}.add input{width:100%;font-size:12px}.add button{padding:6px 9px}.closegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#d9e0e5}.cycle{background:white;padding:12px}.cycle strong{font-size:14px}.numbers{display:flex;gap:15px;align-items:end;margin-top:10px}.numbers label{font-size:11px;color:#64727e}.numbers input{width:75px;font-size:24px;font-weight:bold;border:0;border-bottom:1px solid #ddd;color:#159451;padding:2px}.numbers input.lost{color:#bf352c;width:60px}.result{background:#f3f7fa}.report{white-space:pre-wrap;font:14px/1.6 Arial;background:#f5f7f9;padding:14px;border-radius:6px}#newReason{width:100%}@media(max-width:850px){.top{grid-template-columns:1fr}.bars{grid-template-columns:1fr}.closegrid{grid-template-columns:repeat(2,1fr)}.bar{grid-template-columns:100px 1fr 55px}body{padding:9px}}@media print{button,.add,.toolbar,.x{display:none!important}body{background:white}.panel{break-inside:avoid}}</style></head><body><header><div><h1>Cobrança de atrasos por transportador</h1><small id="subtitle"></small></div><div><span class="big" id="grand">0</span> <small>rotas em atraso</small></div></header><div class="toolbar"><label class="field">Data da operação<input type="date" id="date"></label><label class="field">Prazo para retorno<input type="date" id="deadline"></label><label class="field">Seu nome / área<input id="owner" placeholder="Ex.: Torre de Controle"></label><label class="field">Novo transportador<input id="newCarrier" placeholder="Nome + Enter"></label><button class="light" onclick="window.print()">Imprimir / PDF</button><button class="light" onclick="copyReport()">Copiar reporte</button><button class="light" onclick="downloadReport()">Baixar TXT</button></div><div class="top"><section class="panel"><h3>Rotas em atraso por transportador</h3><div class="bars" id="bars"></div></section><section class="panel"><h3>Motivos (editáveis)</h3><div id="reasons"></div><input id="newReason" placeholder="Novo motivo + Enter"></section></div><div class="cards" id="cards"></div><section class="panel" style="padding:0;overflow:hidden;margin-top:12px"><div class="cardhead"><strong>FECHAMENTO OTT 3.0</strong><small style="color:#cbd5df">por ciclo</small></div><div class="closegrid" id="cycles"></div></section><section class="panel"><h3>Mensagem automática para WhatsApp</h3><div class="report" id="report"></div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button onclick="copyReport()">Copiar mensagem</button><button class="light" onclick="downloadReport()">Baixar mensagem</button></div></section><script>
const KEY='ott3_atrasos_v1';const initial={date:'2026-10-21',deadline:'2026-10-23',owner:'',carriers:['HAWK','KANGU','ECO EXPRESS','ONTIME','PARCEIRO','ALC','COOPMETRO','DECARGO','MELI EXTRA','M.J SIMÕES','AVT','DELUNA','PRALOG'],reasons:['Atraso Drive','Atraso Operação','Baixo SPR','Contagem drive'],routes:[['HAWK','F3_CHP','Atraso Drive'],['HAWK','T2_AM1','Contagem drive'],['KANGU','C6_CHP','Atraso Drive'],['KANGU','B7_CHP','Atraso Drive'],['KANGU','B8_CHP','Atraso Operação'],['KANGU','D6_CHP','Atraso Drive'],['ONTIME','J2_AM1','Atraso Drive'],['PARCEIRO','A4_CHP','Atraso Drive'],['DECARGO','V3_AM1','Contagem drive'],['DECARGO','A2_AM1','Atraso Drive'],['DECARGO','VL5_AM1','Atraso Drive'],['AVT','I8_AM1','Atraso Drive'],['AVT','H7_AM1','Atraso Drive']],cycles:{CHP:{pct:'91.2',lost:'6'},AM1:{pct:'94.3',lost:'7'},PM1:{pct:'0',lost:'0'},SD:{pct:'0',lost:'0'},TOTAL:{pct:'92.8',lost:'13'}}};let s;try{s=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){s=structuredClone(initial)}if(!s.reasons.includes('Baixo SPR'))s.reasons.push('Baixo SPR');const $=id=>document.getElementById(id),esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=d=>d?d.split('-').reverse().join('/'):'—',n=x=>Number(String(x).replace(',','.'))||0,save=()=>localStorage.setItem(KEY,JSON.stringify(s));function setField(k,v){s[k]=v;save();renderSummary()}function count(c){return s.routes.filter(r=>r[0]===c).length}function renderSummary(){const total=s.routes.length;$('grand').textContent=total;$('subtitle').textContent=`Operação de ${fmt(s.date)} · retorno até ${fmt(s.deadline)}`;$('bars').innerHTML=s.carriers.map(c=>`<div class="bar"><span>${esc(c)}</span><div class="track"><div class="fill" style="width:${total?100*count(c)/Math.max(...s.carriers.map(count),1):0}%"></div></div><b>${count(c)} rota${count(c)===1?'':'s'}</b></div>`).join('');$('reasons').innerHTML=s.reasons.map((r,i)=>`<div class="reason"><input value="${esc(r)}" onchange="renameReason(${i},this.value)"><b>${s.routes.filter(x=>x[2]===r).length}</b><button class="light" onclick="removeReason(${i})">×</button></div>`).join('');$('report').textContent=reportText()}
function renderCards(){$('cards').innerHTML=s.carriers.map((c,ci)=>`<div class="card"><div class="cardhead"><span>${esc(c)}</span><span>${count(c)} rotas <button class="x" style="color:white" title="Excluir transportador" onclick="removeCarrier(${ci})">×</button></span></div>${s.routes.map((r,i)=>r[0]===c?`<div class="route"><span>${esc(r[1])}</span><select onchange="s.routes[${i}][2]=this.value;save();render()">${s.reasons.map(x=>`<option ${x===r[2]?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="x" onclick="s.routes.splice(${i},1);save();render()">×</button></div>`:'').join('')||'<div class="route muted">Sem rotas em atraso</div>'}<div class="add"><input id="route${ci}" placeholder="NOVA ROTA" onkeydown="if(event.key==='Enter')addRoute(${ci})"><button class="light" onclick="addRoute(${ci})">+</button><button onclick="copyCarrier(${ci})">Msg</button></div></div>`).join('')}
function renderCycles(){$('cycles').innerHTML=['CHP','AM1','PM1','SD','TOTAL'].map(c=>`<div class="cycle ${c==='TOTAL'?'result':''}"><strong>${c==='TOTAL'?'RESULTADO TOTAL DO DIA':c}</strong><div class="numbers"><label>Fechamento<br><input type="text" inputmode="decimal" value="${esc(s.cycles[c].pct)}" onchange="s.cycles['${c}'].pct=this.value;save();renderSummary()"> %</label><label>Carros perdidos<br><input class="lost" type="number" min="0" value="${esc(s.cycles[c].lost)}" onchange="s.cycles['${c}'].lost=this.value;save();renderSummary()"></label></div></div>`).join('')}
function render(){renderSummary();renderCards();renderCycles()}function addRoute(ci){let v=$('route'+ci).value.trim().toUpperCase();if(!v)return;s.routes.push([s.carriers[ci],v,s.reasons[0]]);save();render()}function renameReason(i,v){v=v.trim();if(!v)return;const old=s.reasons[i];s.reasons[i]=v;s.routes.forEach(r=>{if(r[2]===old)r[2]=v});save();render()}function removeReason(i){if(s.reasons.length<2)return alert('Mantenha ao menos um motivo.');let old=s.reasons.splice(i,1)[0];s.routes.forEach(r=>{if(r[2]===old)r[2]=s.reasons[0]});save();render()}function removeCarrier(i){if(!confirm('Excluir transportador e suas rotas?'))return;let c=s.carriers.splice(i,1)[0];s.routes=s.routes.filter(r=>r[0]!==c);save();render()}function addCarrier(){let v=$('newCarrier').value.trim().toUpperCase();if(v&&!s.carriers.includes(v)){s.carriers.push(v);save();render()}$('newCarrier').value=''}function addReason(){let v=$('newReason').value.trim();if(v&&!s.reasons.includes(v)){s.reasons.push(v);save();render()}$('newReason').value=''}function reportText(){let lines=[`Resultado parcial de fechamento OTT 3.0 ${s.cycles.TOTAL.pct.replace('.',',')}% — ${fmt(s.date)}`,'','Trazendo as dispersões para acompanhamento do fechamento:','',`- ${s.routes.length} rotas em atraso no total.`];for(let c of ['CHP','AM1','PM1','SD'])lines.push(`- ${c}: ${s.cycles[c].pct.replace('.',',')}% de fechamento | ${s.cycles[c].lost} carros perdidos.`);lines.push(`- Resultado total do dia: ${s.cycles.TOTAL.pct.replace('.',',')}% de fechamento | ${s.cycles.TOTAL.lost} carros perdidos.`,'Sendo:');for(let r of s.reasons)lines.push(`${r}: ${s.routes.filter(x=>x[2]===r).length}`);return lines.join('\n')}async function copy(t){try{await navigator.clipboard.writeText(t);alert('Mensagem copiada!')}catch(e){let el=document.createElement('textarea');el.value=t;document.body.append(el);el.select();document.execCommand('copy');el.remove();alert('Mensagem copiada!')}}function copyReport(){copy(reportText())}function copyCarrier(i){let c=s.carriers[i],rows=s.routes.filter(r=>r[0]===c);copy(`COBRANÇA DE ATRASOS — ${c}\nOperação: ${fmt(s.date)}\nPrazo de retorno: ${fmt(s.deadline)}\n${rows.length} rota(s) em atraso\n${rows.map(r=>r[1]+' — '+r[2]).join('\n')||'Sem rotas em atraso'}\nResponsável: ${s.owner||'Não informado'}`)}function downloadReport(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([reportText()],{type:'text/plain;charset=utf-8'}));a.download='reporte_ott_'+s.date+'.txt';a.click();URL.revokeObjectURL(a.href)}for(let k of ['date','deadline','owner']){$(k).value=s[k];$(k).addEventListener('change',e=>setField(k,e.target.value))}$('newCarrier').addEventListener('keydown',e=>{if(e.key==='Enter')addCarrier()});$('newReason').addEventListener('keydown',e=>{if(e.key==='Enter')addReason()});render();
</script></body></html>
